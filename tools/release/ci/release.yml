# ШАБЛОН GitHub Actions для релизных сборок REBOOT.
#
# Этот файл НЕ активен: он лежит в tools/release/ci/. Чтобы включить его,
# скопируйте его в .github/workflows/release.yml в ПРИВАТНОМ репозитории и
# заведите секреты (см. docs/release.md). Без секретов сборки пройдут, но
# пакеты будут без подписи Developer ID / Authenticode.
#
# Секреты (все необязательные):
#   MACOS_CERT_P12_BASE64     Developer ID Application .p12 в base64
#   MACOS_CERT_PASSWORD       пароль к .p12
#   MACOS_SIGN_IDENTITY       "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_APPLE_ID     Apple ID для notarytool
#   MACOS_NOTARY_TEAM_ID      Team ID
#   MACOS_NOTARY_PASSWORD     app-specific password
#   WIN_CERT_PFX_BASE64       Authenticode .pfx в base64
#   WIN_CERT_PASSWORD         пароль к .pfx

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  macos:
    name: macOS package
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Import Developer ID certificate (optional)
        if: env.HAS_MACOS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/reboot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials (optional)
        if: env.HAS_MACOS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials reboot-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
            --keychain "$RUNNER_TEMP/reboot-signing.keychain-db"
          echo "REBOOT_NOTARY_PROFILE=reboot-notary" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          REBOOT_MACOS_SIGN_IDENTITY: ${{ env.HAS_MACOS_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: bash tools/release/build_macos.sh

      - name: Verify package
        run: python3 tools/release/verify_package.py --platform macos dist/REBOOT-macOS-v*.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: reboot-macos-package
          path: |
            dist/REBOOT-macOS-v*.zip
            dist/REBOOT-macOS-v*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload symbols (private, short retention)
        uses: actions/upload-artifact@v4
        with:
          name: reboot-macos-symbols-${{ github.sha }}
          path: dist/symbols/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup keychain
        if: always() && env.HAS_MACOS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/reboot-signing.keychain-db" || true

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: flutter pub get
        run: flutter pub get

      - name: Decode Authenticode certificate (optional)
        if: env.HAS_WIN_CERT == 'true'
        env:
          PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "reboot-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "REBOOT_WIN_CERT_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package
        env:
          REBOOT_WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: ./tools/release/build_windows.ps1

      - name: Verify package
        run: python tools/release/verify_package.py --platform windows (Get-ChildItem dist/REBOOT-Windows-v*.zip).FullName

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: reboot-windows-package
          path: |
            dist/REBOOT-Windows-v*.zip
            dist/REBOOT-Windows-v*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload symbols (private, short retention)
        uses: actions/upload-artifact@v4
        with:
          name: reboot-windows-symbols-${{ github.sha }}
          path: dist/symbols/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup certificate
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "reboot-signing.pfx")
